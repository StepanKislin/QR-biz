<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Генератор QR-кодов</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QR Code Generator -->
  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
  <!-- Custom JS -->
  <script src="main.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <div class="container mx-auto px-4 py-8 max-w-2xl">
    <h1 class="text-3xl font-bold text-center mb-8 text-indigo-700">Генератор QR-кодов</h1>

    <!-- URL -->
    <section class="bg-white p-6 rounded-xl shadow-md mb-6">
      <h2 class="text-xl font-semibold mb-3 text-gray-700">Сайт</h2>
      <div class="space-y-3">
        <input
          type="url"
          id="url-input"
          placeholder="https://example.com"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
        <button
          id="gen-url"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg transition"
        >
          Сгенерировать QR сайта
        </button>
      </div>
    </section>

    <!-- Wi-Fi -->
    <section class="bg-white p-6 rounded-xl shadow-md mb-6">
      <h2 class="text-xl font-semibold mb-3 text-gray-700">Wi-Fi сеть</h2>
      <div class="space-y-3">
        <input
          type="text"
          id="ssid-input"
          placeholder="Название сети (SSID)"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
        <input
          type="password"
          id="wifi-pass-input"
          placeholder="Пароль (оставьте пустым, если без пароля)"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
        <select
          id="wifi-enc"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        >
          <option value="WPA">WPA / WPA2</option>
          <option value="WEP">WEP</option>
          <option value="nopass">Без пароля</option>
        </select>
        <button
          id="gen-wifi"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition"
        >
          Сгенерировать QR Wi-Fi
        </button>
      </div>
    </section>

    <!-- Телефон -->
    <section class="bg-white p-6 rounded-xl shadow-md mb-6">
      <h2 class="text-xl font-semibold mb-3 text-gray-700">Номер телефона</h2>
      <div class="space-y-3">
        <input
          type="tel"
          id="phone-input"
          placeholder="+7 999 123-45-67"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
        <button
          id="gen-phone"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition"
        >
          Сгенерировать QR звонка
        </button>
      </div>
    </section>

    <!-- Email -->
    <section class="bg-white p-6 rounded-xl shadow-md mb-6">
      <h2 class="text-xl font-semibold mb-3 text-gray-700">Email</h2>
      <div class="space-y-3">
        <input
          type="email"
          id="email-input"
          placeholder="example@mail.com"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
        <button
          id="gen-email"
          class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-lg transition"
        >
          Сгенерировать QR email
        </button>
      </div>
    </section>

    <!-- Печать -->
    <div class="text-center mb-6">
      <button
        id="print-btn"
        class="bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 px-6 rounded-lg transition no-print"
      >
        Печать QR
      </button>
    </div>

    <!-- Область вывода -->
    <div
      id="print-area"
      class="print-area bg-white p-6 rounded-xl shadow-md hidden"
    >
      <div id="print-info" class="text-center mb-4 text-lg font-medium text-gray-800"></div>
      <div id="qr-output" class="flex justify-center"></div>
    </div>
  </div>

  <!-- Печать: показываем только print-area -->
  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      .print-area,
      .print-area * {
        visibility: visible;
      }
      .print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
      }
      img {
        image-rendering: pixelated;
        max-width: 300px;
        height: auto;
      }
    }
  </style>
</body>
</html>
